<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Referral Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF8F1; --paper-alt:#F2EEE1; --paper-raised:#FFFFFF;
    --ink:#1B2A2E; --ink-soft:#5B6D6E; --ink-faint:#8B9A9A;
    --green:#1F7A4D; --green-deep:#145C39; --green-soft:#DDF1E3;
    --gold:#C8932E; --gold-soft:#F6E9CC;
    --stamp:#B4472D; --stamp-soft:#F6DFD7;
    --blue:#33588F; --blue-soft:#DDE6F6;
    --line:#DAD3BF; --line-soft:#E8E3D3;
    --radius:14px; --shadow:0 4px 18px rgba(27,42,46,0.08);
    --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  [data-theme="dark"]{
    --paper:#15201F; --paper-alt:#1C2826; --paper-raised:#1F2C2A;
    --ink:#EDEAE0; --ink-soft:#AEBBB8; --ink-faint:#76847F;
    --green:#3FCB81; --green-deep:#2E9C63; --green-soft:#1E332A;
    --gold:#E0B458; --gold-soft:#332B17; --stamp:#E07457; --stamp-soft:#3A2420;
    --blue:#7FA6E0; --blue-soft:#1C2A3A; --line:#33433F; --line-soft:#283733;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5; transition:background .25s, color .25s; }
  .site-header{ background:var(--ink); color:var(--paper); position:sticky; top:0; z-index:30; box-shadow:var(--shadow);}
  [data-theme="dark"] .site-header{ background:#0E1716; }
  .header-inner{ max-width:1080px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--ink); background:var(--green); width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; transform:rotate(-3deg); box-shadow:var(--shadow); }
  .brand-title{ font-family:var(--font-display); font-weight:700; font-size:19px; }
  .brand-sub{ font-size:12.5px; color:#B9C7C5; display:block; }
  .header-actions{ display:flex; gap:10px; align-items:center; }
  
  .primary-btn, .ghost-btn, .icon-btn{ font-family:var(--font-body); font-weight:600; cursor:pointer; border:none; border-radius:10px; padding:10px 16px; font-size:14px; }
  .primary-btn{ background:var(--green); color:#fff; box-shadow:var(--shadow);}
  .ghost-btn{ background:transparent; color:inherit; border:1.5px solid currentColor; opacity:.85;}
  .icon-btn{ background:transparent; color:inherit; font-size:18px; padding:6px 9px; }
  
  .container{ max-width:1080px; margin:0 auto; padding:12px 20px 40px; }
  .tabs{ display:flex; gap:8px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .tab-btn{ background:none; border:none; padding:8px 4px; margin-right:14px; font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--green); }
  
  .controls-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
  .controls-bar input, .controls-bar select{ padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper-raised); color:var(--ink); font-size:13.5px; flex:1 1 200px;}
  
  .ledger-list{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .ledger-row{ display:grid; grid-template-columns:42px 1.6fr 1fr 1fr 70px auto; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px dashed var(--line); }
  .ledger-row:last-child{ border-bottom:none; }
  .row-name{ font-family:var(--font-display); font-weight:700; font-size:15.5px; }
  .badge{ font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:20px; }
  .badge-verified{ background:var(--green-soft); color:var(--green-deep); }
  .app-icon{ width:28px; height:28px; border-radius:8px; object-fit:cover; background:var(--green); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:700;}
  .bonus-amount{ font-size:14px; font-weight:600; color:var(--green-deep); }
  
  .matrix-wrap{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); overflow-x:auto; }
  .matrix-table{ border-collapse:collapse; width:100%; font-size:12px; text-align:center; }
  .matrix-table th, .matrix-table td{ border:1px dashed var(--line); padding:8px; }
  .matrix-corner{ position:sticky; left:0; background:var(--paper-alt); text-align:left; z-index:2; }
  
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,20,20,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; backdrop-filter:blur(2px); }
  .modal-card{ background:var(--paper-raised); border-radius:18px; width:100%; max-width:400px; padding:22px 24px; }
  .modal-form label{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; font-size:13px; font-weight:600;}
  .modal-form input, .modal-form select{ padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }
  
  .toast-container{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; }
  .toast{ background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:10px; margin-top:8px; }
  
  .auth-overlay{ position:absolute; inset:0; background:rgba(251,248,241,0.9); z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;}
  [data-theme="dark"] .auth-overlay{ background:rgba(21,32,31,0.9); }
</style>
</head>
<body data-theme="light">

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">₹</span>
      <div>
        <span class="brand-title">UPI Referral Ledger</span>
        <span class="brand-sub">Community cashback tracker</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn">🌙</button>
      <button id="googleLoginBtn" class="ghost-btn">Sign in with Google</button>
      <button id="logoutBtn" class="ghost-btn" hidden>Sign out</button>
    </div>
  </div>
</header>

<main class="container" id="mainContent">
  <div class="tabs">
    <button class="tab-btn active" id="tabApps">📒 Browse apps</button>
    <button class="tab-btn" id="tabLedger">👥 My Referral Matrix</button>
  </div>

  <section id="appsPanel">
    <div class="controls-bar">
      <input id="searchInput" type="search" placeholder="Search apps...">
      <button id="addAppBtn" class="primary-btn">＋ Add app</button>
    </div>
    <div id="appsList" class="ledger-list"></div>
  </section>

  <section id="ledgerPanel" style="position:relative;" hidden>
    <div id="authWall" class="auth-overlay">
      <h3>Sign in to track referrals</h3>
      <p>Your grid is synced securely to your Google account.</p>
      <button class="primary-btn" onclick="document.getElementById('googleLoginBtn').click()">Sign in with Google</button>
    </div>
    
    <div class="controls-bar">
      <button id="addFriendBtn" class="primary-btn">＋ Add friend</button>
    </div>
    <div class="matrix-wrap">
      <table class="matrix-table" id="matrixTable"></table>
    </div>
  </section>
</main>

<!-- Modals -->
<div class="modal-backdrop" id="friendModal" hidden>
  <div class="modal-card">
    <h3>Add a Friend</h3>
    <form id="friendForm" class="modal-form">
      <label>Name <input type="text" id="friendName" required></label>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" onclick="document.getElementById('friendModal').hidden=true">Cancel</button>
        <button type="submit" class="primary-btn">Add</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="cellModal" hidden>
  <div class="modal-card">
    <h3 id="cellTitle">Update Status</h3>
    <form id="cellForm" class="modal-form">
      <input type="hidden" id="cellFid">
      <input type="hidden" id="cellAid">
      <label>Status
        <select id="cellStatus">
          <option value="">Not started</option>
          <option value="in_progress">⏳ In progress</option>
          <option value="referred">✅ Already referred</option>
        </select>
      </label>
      <label>Received (₹) <input type="number" id="cellReceived"></label>
      <label>Pending (₹) <input type="number" id="cellPending"></label>
      <div class="modal-actions">
        <button type="button" class="ghost-btn" onclick="document.getElementById('cellModal').hidden=true">Cancel</button>
        <button type="submit" class="primary-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBK5qMGiDmNmZvXaoZL-4ADiScP7Mkhfns",
  authDomain: "freemoney-cb6b4.firebaseapp.com",
  projectId: "freemoney-cb6b4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let appsCache = [];
let friendsCache = [];
let matrixCache = [];

// UI Elements
const toastContainer = document.getElementById('toastContainer');
const loginBtn = document.getElementById('googleLoginBtn');
const logoutBtn = document.getElementById('logoutBtn');
const authWall = document.getElementById('authWall');

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  toastContainer.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Authentication
loginBtn.addEventListener('click', () => auth.signInWithPopup(provider).catch(e => toast(e.message)));
logoutBtn.addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    loginBtn.hidden = true; logoutBtn.hidden = false;
    authWall.hidden = true;
    loadUserData(user.uid);
  } else {
    loginBtn.hidden = false; logoutBtn.hidden = true;
    authWall.hidden = false;
    friendsCache = []; matrixCache = [];
    renderMatrix();
  }
});

// App Fetching (Global)
db.collection('apps').onSnapshot(snap => {
  appsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderApps();
  renderMatrix();
});

function renderApps() {
  document.getElementById('appsList').innerHTML = appsCache.map(app => `
    <div class="ledger-row">
      <div class="app-icon">${app.name.charAt(0)}</div>
      <div>
        <span class="row-name">${app.name}</span>
        ${app.verified_by_admin ? '<span class="badge badge-verified">✅ Verified</span>' : ''}
      </div>
      <div><strong>Join:</strong> ₹${app.joining_min || 0}</div>
      <div><strong>Ref:</strong> ₹${app.referral_min || 0}</div>
    </div>
  `).join('');
}

// User Data Fetching (Scoped)
function loadUserData(uid) {
  db.collection('users').doc(uid).collection('friends').onSnapshot(snap => {
    friendsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMatrix();
  });
  db.collection('users').doc(uid).collection('matrix').onSnapshot(snap => {
    matrixCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMatrix();
  });
}

// Matrix Rendering
function renderMatrix() {
  if (!appsCache.length || !friendsCache.length) {
    document.getElementById('matrixTable').innerHTML = '<tr><td>No data to display. Add apps and friends.</td></tr>';
    return;
  }
  
  const thead = `<tr><th class="matrix-corner">Friend \\ App</th>${appsCache.map(a => `<th>${a.name}</th>`).join('')}</tr>`;
  const tbody = friendsCache.map(f => {
    const cells = appsCache.map(a => {
      const cell = matrixCache.find(m => m.friend_id === f.id && m.app_id === a.id);
      const emoji = cell?.status === 'referred' ? '✅' : cell?.status === 'in_progress' ? '⏳' : '➕';
      return `<td><button class="ghost-btn" onclick="openCell('${f.id}', '${a.id}')">${emoji}<br>₹${cell?.amount_received||0}</button></td>`;
    }).join('');
    return `<tr><th class="matrix-corner">${f.name}</th>${cells}</tr>`;
  }).join('');
  
  document.getElementById('matrixTable').innerHTML = thead + tbody;
}

// Tab Switching
document.getElementById('tabApps').onclick = () => { document.getElementById('appsPanel').hidden = false; document.getElementById('ledgerPanel').hidden = true; };
document.getElementById('tabLedger').onclick = () => { document.getElementById('appsPanel').hidden = true; document.getElementById('ledgerPanel').hidden = false; };

// Friend & Cell Modals
document.getElementById('addFriendBtn').onclick = () => document.getElementById('friendModal').hidden = false;
document.getElementById('friendForm').onsubmit = async (e) => {
  e.preventDefault();
  if(!currentUser) return;
  await db.collection('users').doc(currentUser.uid).collection('friends').add({ name: document.getElementById('friendName').value });
  document.getElementById('friendModal').hidden = true;
  document.getElementById('friendForm').reset();
};

window.openCell = (fid, aid) => {
  document.getElementById('cellFid').value = fid;
  document.getElementById('cellAid').value = aid;
  const cell = matrixCache.find(m => m.friend_id === fid && m.app_id === aid);
  document.getElementById('cellStatus').value = cell?.status || '';
  document.getElementById('cellReceived').value = cell?.amount_received || 0;
  document.getElementById('cellPending').value = cell?.amount_pending || 0;
  document.getElementById('cellModal').hidden = false;
};

document.getElementById('cellForm').onsubmit = async (e) => {
  e.preventDefault();
  if(!currentUser) return;
  const fid = document.getElementById('cellFid').value;
  const aid = document.getElementById('cellAid').value;
  await db.collection('users').doc(currentUser.uid).collection('matrix').doc(`${fid}_${aid}`).set({
    friend_id: fid, app_id: aid,
    status: document.getElementById('cellStatus').value,
    amount_received: Number(document.getElementById('cellReceived').value),
    amount_pending: Number(document.getElementById('cellPending').value)
  });
  document.getElementById('cellModal').hidden = true;
};
</script>
</body>
</html>
